[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-rewards"
version = "0.1.0"
description = "Turn your coding-agent traces into USDC/USDT — find, redact, and bank your sessions via MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "agent", "traces", "training-data", "privacy"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
agent-rewards-mcp = "agent_rewards.server:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["agent_rewards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-q"
